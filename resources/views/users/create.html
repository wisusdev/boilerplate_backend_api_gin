<!DOCTYPE html>
<html lang="en">
{{template "header" .}}

<body>
    {{template "navbar" .}}

    <main class="container">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <p class="text-center mb-0">{{call .Translate "create_user"}}</p>
                <a href="/users" class="btn btn-secondary btn-sm">{{call .Translate "back_to_users"}}</a>
            </div>
            <div class="card-body">
                <form method="POST" action="/users/store">
                    <div class="row">
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="username" class="form-label">{{call .Translate "username"}}</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="first_name" class="form-label">{{call .Translate "first_name"}}</label>
                                <input type="text" class="form-control" id="first_name" name="first_name" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="mb-3">
                                <label for="last_name" class="form-label">{{call .Translate "last_name"}}</label>
                                <input type="text" class="form-control" id="last_name" name="last_name" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">{{call .Translate "email"}}</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="password" class="form-label">{{call .Translate "password"}}</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="confirm_password" class="form-label">{{call .Translate "confirm_password"}}</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="role" class="form-label">{{call .Translate "role"}}</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="" disabled selected>{{call .Translate "select_option"}}</option>
                            {{range .Data}}
                                <option value="{{.ID}}">{{.Name}}</option>
                            {{end}}
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary">{{call .Translate "create_user"}}</button>
                </form>
            </div>
        </div>
    </main>

    {{template "footer" .}}
</body>

</html>
